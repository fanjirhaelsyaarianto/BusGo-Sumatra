<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Tiket - BusGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                🚌 BusGo Sumatra
            </a>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="jadwal.html">Jadwal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="pesan.html">
                            Pesan Tiket
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="armada.html">Armada</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="kontak.html">Kontak</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="container py-5">
        <div class="card shadow mx-auto" style="max-width:600px">
            <div class="card-body">
                <h3 class="mb-4">
                    Pemesanan Tiket
                </h3>
                <form>
                    <div class="mb-3">
                        <label>Nama Penumpang</label>
                        <input type="text" id="nama" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Rute</label>
                        <select id="rute" class="form-select">
                            <option value="">
                                Pilih Rute
                            </option>
                            <option>
                                Jambi - Palembang
                            </option>
                            <option>
                                Jambi - Pekanbaru
                            </option>
                            <option>
                                Jambi - Padang
                            </option>
                            <option>
                                Jambi - Bengkulu
                            </option>
                            <option>
                                Jambi - Lampung
                            </option>
                            <option>
                                Jambi - Medan
                            </option>
                            <option>
                                Jambi - Banda Aceh
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Type Kelas</label>
                        <select id="kelas" class="form-select">
                            <option value="">Pilih Kelas</option>
                            <option value="Executive">Executive</option>
                            <option value="VIP">VIP</option>
                            <option value="Sleeper">Sleeper</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Jam Berangkat</label>
                        <select id="jam" class="form-select">
                            <option value="">
                                Pilih Jam
                            </option>
                            <option value="08:00 WIB">
                                08:00 WIB
                            </option>
                            <option value="10:00 WIB">
                                10:00 WIB
                            </option>
                            <option value="12:00 WIB">
                                12:00 WIB
                            </option>
                            <option value="14:00 WIB">
                                14:00 WIB
                            </option>
                            <option value="16:00 WIB">
                                16:00 WIB
                            </option>
                            <option value="18:00 WIB">
                                18:00 WIB
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Tanggal</label>
                        <input type="date" id="tanggal" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Jumlah Tiket</label>
                        <input type="number" id="jumlah" value="1" min="1" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Total Harga</label>
                        <input id="total" class="form-control" readonly>
                    </div>
                    <button type="button" class="btn btn-success w-100" data-bs-toggle="modal"
                        data-bs-target="#modalBayar">
                        Lanjut Pembayaran
                    </button>
                </form>
            </div>
        </div>
    </section>
    <div class="modal fade" id="modalBayar">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Pembayaran</h5>
                </div>
                <div class="modal-body">
                    <p>
                        <b>Rute :</b>
                        <span id="mRute"></span>
                    </p>
                    <p>
                        <b>Kelas :</b>
                        <span id="mKelas"></span>
                    </p>
                    <p>
                        <b>Jam :</b>
                        <span id="mJam"></span>
                    </p>
                    <p>
                        <b>Jumlah :</b>
                        <span id="mJumlah"></span>
                    </p>
                    <p>
                        <b>Total :</b>
                        <span id="mTotal"></span>
                    </p>
                    <select class="form-select">
                        <option>DANA</option>
                        <option>OVO</option>
                        <option>GoPay</option>
                        <option>Transfer Bank</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success" id="bayar">
                        Bayar Sekarang
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
