<section id="pesan" class="pesan-section container pb-5">

        <div class="card pesan-card shadow">
            <div class="card-body">

                <h3 class="mb-4">Pemesanan Tiket</h3>

                <form id="formPesan">

                    <div class="mb-3">
                        <label>Nama Penumpang</label>
                        <input type="text" id="nama" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Rute</label>
                        <input type="text" id="rute" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label>Jam Berangkat</label>
                        <input type="text" id="jam" class="form-control" readonly>
                    </div>

                    <div class="mb-3">
                        <label>Tanggal Berangkat</label>
                        <input type="date" id="tanggal" class="form-control" min="2026-06-11" required>
                    </div>

                    <div class="mb-3">
                        <label>Jumlah Tiket</label>
                        <input type="number" id="jumlah" value="1" min="1" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Total Harga</label>
                        <input type="text" id="total" class="form-control" readonly>
                    </div>

                    <button type="button" class="btn btn-success w-100" data-bs-toggle="modal"
                        data-bs-target="#modalBayar">
                        Lanjut Pembayaran
                    </button>

                </form>

            </div>
        </div>

    </section>
